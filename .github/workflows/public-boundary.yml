name: Public repository boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  allowed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject files outside the reviewed public list
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.gitignore', 'README.md', 'PROMPT.md', 'LICENSE', 'NOTICE',
              'LICENSES/Apache-2.0.txt', 'site/index.html',
              '.github/workflows/public-boundary.yml',
          }
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')) - {''}
          extra = tracked - allowed
          assert not extra, f'Unreviewed public files: {sorted(extra)}'
          PY
